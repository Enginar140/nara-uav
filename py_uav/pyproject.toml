[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nara-uav"
version = "10.0.0"
description = "TEKNOFEST sabit-kanat IHA otonomi sistemi (Python). Python plans, ArduPlane flies."
requires-python = ">=3.10"
dependencies = [
    "pymavlink>=2.4",
    "numpy>=1.24",
    "shapely>=2.0",
    "networkx>=3.0",
    "pyproj>=3.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
vision = ["opencv-python>=4.8"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
nara-uav = "uav.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
